[package]
name = "notepad"
version = "3.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native COSMIC clone of Microsoft Notepad"
repository = "https://github.com/goshitsarch-eng/notepad"
authors = ["Gosh"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
url = "2"

[dev-dependencies]
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    "about",
    "dbus-config",
    "tokio",
    "winit",
    "wgpu",
    "xdg-portal",
]
