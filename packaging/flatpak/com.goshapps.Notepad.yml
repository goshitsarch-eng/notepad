# Flatpak manifest for XP Notepad.
#
# The Linux executable is exported from Godot first (godot --export-release "Linux x86_64"),
# and packaging/flatpak/build.sh copies it next to this file in a scratch folder and runs
# flatpak-builder on it, so the repository itself is not changed. The executable holds the
# whole app, so there is nothing else to install.
app-id: com.goshapps.Notepad
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: xp_notepad
finish-args:
  - --share=ipc
  # Godot draws through X11, which runs under XWayland on a Wayland desktop.
  - --socket=x11
  - --device=dri
  # The app lists folders with its own file dialogs, so it needs the home folder.
  - --filesystem=home
modules:
  - name: xp-notepad
    buildsystem: simple
    build-commands:
      - install -Dm755 xp_notepad /app/bin/xp_notepad
      - install -Dm644 com.goshapps.Notepad.desktop /app/share/applications/com.goshapps.Notepad.desktop
      - install -Dm644 com.goshapps.Notepad.metainfo.xml /app/share/metainfo/com.goshapps.Notepad.metainfo.xml
      - install -Dm644 com.goshapps.Notepad.svg /app/share/icons/hicolor/scalable/apps/com.goshapps.Notepad.svg
    sources:
      - type: file
        path: xp_notepad
      - type: file
        path: com.goshapps.Notepad.desktop
      - type: file
        path: com.goshapps.Notepad.metainfo.xml
      - type: file
        path: com.goshapps.Notepad.svg
