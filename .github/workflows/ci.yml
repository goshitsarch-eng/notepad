name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot 4.7.2
        run: tools/install_godot.sh "$RUNNER_TEMP/godot"
      - name: Run the tests
        env:
          GODOT: ${{ runner.temp }}/godot/godot
        run: tools/run_tests.sh

  export:
    name: Export smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot 4.7.2 and its export templates
        run: tools/install_godot.sh "$RUNNER_TEMP/godot" --templates
      - name: Export the Linux build
        env:
          GODOT: ${{ runner.temp }}/godot/godot
        run: |
          mkdir -p build/linux-x86_64
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "Linux x86_64" build/linux-x86_64/xp_notepad
          test -x build/linux-x86_64/xp_notepad
